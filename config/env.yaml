# ===== 环境档案：一套参数跑一个环境（2026/10/13 新增）=====
#
# 背景：测试环境和生产环境是**两个不同的小程序**（见 knowledge/环境与目标小程序.md）。
# 在这之前，框架跑起来从不声明"我这次跑的是哪个环境"，appid 安全阀因此一直是**装了但没通电**——
# 谁都没设 UITEST_APP_ID，于是每次跑都是"不校验 appid、可能跑到别的小程序上"。
#
# 用法：
#   python run.py                # 用下面 current 指定的环境
#   python run.py --env prod     # 这次改用 prod 环境（只影响这一次）
#   python tools/use_env.py      # 看当前是哪个环境、每个环境的参数
#   python tools/use_env.py prod # 把 current 改成 prod（永久切换，写回本文件）
#
# 每跑一次，控制台和报告开头都会打一行「本次环境：…」，免得事后分不清跑的是哪个环境。

current: test

envs:
  test:
    label: 测试环境 · 超云生态平台（压铸人的社区百科）
    # 这个 appid 就是安全阀认的值：候选页里 appid 不符的会被排除，一个都找不到就报错
    # （宁可停，也不要跑到生产那个小程序上 —— 两个小程序可能同时被这台手机缓存）
    appid: "wx3de2e1d179b60303"
    # 这台上手机上小程序的**登录账号**（数据库 user.id）。
    # 怎么确认：跑一次会写库的动作，再去库里看那行是谁的；或者
    #   select user_id, max(create_time) from course_view_record group by user_id order by 2 desc limit 5;
    # ⚠️ 2026/10/13 实测登录的是 1966910（早先文档里记的 1966909 是另一个账号，换过了）。
    # 换账号时改这一行即可 —— 所有对账工具都会用它，不用每个工具手工传 --user。
    user_id: "1966910"
    # 数据库只读/写都用这份配置；连不上会被翻译成人话，并且相关用例记「跳过」而不是红
    db_config: "config/db.local.yaml"
    # 允许在这套环境下打开写开关（UITEST_ALLOW_SUBMIT=1）测"会改数据"的用例
    allow_write: true

  prod:
    label: 生产环境 · 同名小程序（不碰数据）
    # ⚠️ 待 owner 补：生产小程序的 appid。
    # 没填的这段时间，`run.py --env prod` 会**直接停下并告诉你原因** ——
    # 这不是偷懒，是安全阀：拿不到 appid 就无法保证没测到别的小程序上。
    appid: ""
    # 生产库一律不连（留空 = 这条环境下不会去动任何数据库）
    db_config: ""
    # 生产环境强制关掉写开关：就算你设了 UITEST_ALLOW_SUBMIT=1 也会被清掉并提示
    allow_write: false
