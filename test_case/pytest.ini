[pytest]
# 注册等级
markers =
    P0: 最高优先级，冒烟测试用例（必执行）
    P1: 中优先级，核心功能测试用例
    P2: 低优先级，一般功能测试用例
    P3: 最低优先级，回归/边界值测试用例
# 指定测试用例目录/文件
testpaths = ./
addopts = --self-contained-html -p pytest_asyncio -s -v
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 失败重试 1 次、间隔 10 秒
# （注释原来写的是"重试 2 次"/"间隔 1 秒"，与配置不符，这里一并改正）
# ⚠️ UI 用例的重试要谨慎：重复执行会重复点击，可能把偶发失败变成状态污染
reruns = 1
reruns_delay = 10

# ---------- 日志 ----------
# 原来没有任何日志配置：node 子进程的输出只能看控制台，还遇到过编码乱码把真实
# 报错吞掉。现在同时落文件与控制台，日志有据可查。
# 注意：log_file 所在目录不会自动创建（run.py 会建好；单独跑 pytest 前先确保存在）
log_file = ../report/log/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
