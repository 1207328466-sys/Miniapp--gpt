[pytest]
# 注册等级
markers =
    P0: 最高优先级，冒烟测试用例（必执行）
    P1: 中优先级，核心功能测试用例
    P2: 低优先级，一般功能测试用例
    P3: 最低优先级，回归/边界值测试用例
# 指定测试用例目录/文件
testpaths = ./
addopts = --self-contained-html -p pytest_asyncio -s -v
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 全局失败重试2次
reruns = 1
# 重试间隔1秒
reruns_delay = 10
