[pytest]
# 注册等级
markers =
    P0: 最高优先级，冒烟测试用例（必执行）
    P1: 中优先级，核心功能测试用例
    P2: 低优先级，一般功能测试用例
    P3: 最低优先级，回归/边界值测试用例
# 指定测试用例目录/文件
testpaths = ./
addopts = --self-contained-html -p pytest_asyncio -s -v
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# **不自动重跑**（owner 2026/10/12 定的口径）
# 原因：UI 用例重跑是"重新点一遍" —— 会把一次偶发失败变成状态污染
# （数据改了两遍、筛选 tab 被切了两次），而且重跑出来的绿会掩盖真实的问题。
# 偶发失败的正确处理是**由人**单条复跑确认（python run.py -k 用例编号），
# 再由人判断是环境问题还是真的回归；框架不替人做这个决定。
reruns = 0

# ---------- 日志 ----------
# 原来没有任何日志配置：node 子进程的输出只能看控制台，还遇到过编码乱码把真实
# 报错吞掉。现在同时落文件与控制台，日志有据可查。
# 注意两点：
#   1. log_file 所在目录不会自动创建（run.py 会建好；单独跑 pytest 前先确保存在）
#   2. log_cli 关掉是**故意的**：conftest 里的 emit() 已经既 print 又 logging，
#      若 log_cli 开着，同一行会在控制台出现两次。
#      实测教训：光配 log_file 不够 —— Python 侧没产生 logging 记录时，
#      日志文件会一直是 0 字节（第一版就是这样）。
log_file = ../report/log/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
